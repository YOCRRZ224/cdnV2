<style>
/* Shared design tokens (light by default, dark via prefers-color-scheme).
   Prefixed --ui- so they never collide with a page's own legacy variables
   while pages are being migrated. Included once, via _navbar.html. */
:root {
    color-scheme: light dark;
    --ui-bg: #ffffff;
    --ui-surface: #f6f8fa;
    --ui-border: #d0d7de;
    --ui-text: #1f2328;
    --ui-muted: #59636e;
    --ui-accent: #0b5fff;
    --ui-accent-bg: #eaf1ff;
    --ui-accent-solid: #0b5fff; /* filled buttons/badges with white text */
    --ui-danger: #cf222e;
    --ui-success: #116329;
    --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ui-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ui-radius: 6px;
    --ui-width: 960px;
}
@media (prefers-color-scheme: dark) {
    :root {
        --ui-bg: #0d1117;
        --ui-surface: #161b22;
        --ui-border: #30363d;
        --ui-text: #e6edf3;
        --ui-muted: #9198a1;
        --ui-accent: #4c8dff;
        --ui-accent-bg: #12233f;
        --ui-accent-solid: #2f6feb;
        --ui-danger: #f85149;
        --ui-success: #3fb950;
    }
}
:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

/* ---- Shared polish (loads after page CSS, so it wins at equal specificity) ---- */
body { font-family: var(--ui-font); line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.1rem) !important; font-weight: 600 !important; letter-spacing: -0.01em !important; line-height: 1.25; }
/* UI text in sans; monospace stays for paths, file names and code */
input, button, textarea, select, .btn, .folder-option, .folder-picker-label, .file-pill, .file-ext-tag, footer, .history-tab { font-family: var(--ui-font) !important; }
/* Notices: neutral info banner instead of an accent bar */
blockquote { border-left: 1px solid var(--ui-border) !important; background: var(--ui-surface); border-radius: var(--ui-radius); max-width: none !important; }
/* Inputs and buttons */
.filter-input, .search-input, .url-input { font-size: 0.95rem; background: var(--ui-bg); }
.filter-input:focus, .search-input:focus, .url-input:focus { border-color: var(--ui-accent) !important; outline: 2px solid var(--ui-accent-bg); }
.btn { font-weight: 500 !important; }
.btn-primary { font-weight: 500 !important; }
/* Destination chips become a compact segmented control */
.folder-option { border-radius: var(--ui-radius) !important; font-size: 0.85rem !important; font-weight: 500 !important; background: var(--ui-bg); }
.folder-option.active { background: var(--ui-accent-solid) !important; border-color: var(--ui-accent-solid) !important; color: #fff !important; }
.file-pill { border-radius: var(--ui-radius) !important; font-weight: 500 !important; }
/* Lists: quiet hover, tabular numbers for sizes */
.list-item:hover { background: var(--ui-surface); }
.item-size, .file-pill { font-variant-numeric: tabular-nums; }
footer { color: var(--ui-muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: 0.01ms !important; } }
</style>
